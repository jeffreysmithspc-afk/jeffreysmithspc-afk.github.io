<title>Scan to Sign In · Impact Water 2026 Golf Tournament</title>
<style>
    :root {
      --navy:      #0F3C5A;
      --logo-blue: #07569B;
      --aqua:      #5AC3E3;
      --line:      #D8E1E9;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--navy);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* White wordmark bar, exactly as the site header does it (Section 10) */
    .site-header {
      flex: 0 0 auto;
      background: #fff;
      padding: 1.8vmin 3vmin;
      border-bottom: 1px solid var(--line);
    }
    .site-header img { display: block; width: 26vmin; max-width: 240px; height: auto; }

    .stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3.4vmin;
      padding: 4vmin;
      text-align: center;
    }

    .words {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2vmin;
    }

    .eyebrow {
      margin: 0;
      font-size: 2.4vmin;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.6vmin;
      color: var(--aqua);
      line-height: 1.4;
    }

    h1 {
      margin: 0;
      font-size: 7vmin;
      font-weight: bold;
      letter-spacing: -0.1vmin;
      line-height: 1.1;
    }

    .qr-card {
      flex: 0 0 auto;
      background: #fff;
      padding: 2.4vmin;
      line-height: 0;
    }
    .qr-card img {
      display: block;
      width: 44vmin;
      height: 44vmin;
      image-rendering: pixelated;   /* keeps module edges crisp when scaled */
    }

    .url {
      margin: 0;
      font-size: 2.2vmin;
      color: #C9DCE9;
      word-break: break-all;
    }

    .tagline {
      margin: 0;
      font-size: 1.9vmin;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5vmin;
      color: #7E9FB5;
    }

    /* Tablet landscape: words beside the code, so both stay large. */
    @media (orientation: landscape) and (min-width: 700px) {
      .stage { flex-direction: row; gap: 7vmin; }
      .words { align-items: flex-start; text-align: left; max-width: 46vw; gap: 2.4vmin; }
      .qr-card img { width: 58vmin; height: 58vmin; }
      h1 { font-size: 8vmin; }
      .eyebrow { font-size: 2.6vmin; }
      .url { font-size: 2.3vmin; }
    }

    /* Handset fallback, if it ever gets held up on a phone. */
    @media (max-width: 480px) {
      .site-header img { width: 42vmin; }
      .qr-card img { width: 64vmin; height: 64vmin; }
      h1 { font-size: 8vmin; }
      .eyebrow, .url { font-size: 3.2vmin; }
      .tagline { font-size: 2.8vmin; }
    }
</style>
</head>

    }).catch(function () { /* denied or unsupported — harmless */ });
  }
  hold();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && lock === null) { hold(); }
  });
})();
</script>
